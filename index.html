<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index,follow">
<title>Apri Cancello — Privacy Policy</title>
<!--
  ============================================================================
  Apri Cancello - Privacy Policy e avvertenze d'uso (IT / EN)
  Pagina statica autonoma (CSS e JavaScript inline, nessuna dipendenza esterna),
  pubblicabile su GitHub Pages o su qualunque hosting. Un solo URL per Google Play.
  Modello: alert4pills-privacy (stesso stile). Vedi README.md nella stessa cartella.
  I dati del titolare sono nell'oggetto CONTROLLER; la data in EFFECTIVE; il numero
  di versione in VERSION.
  ============================================================================
-->
<style>
  :root{
    --bg:#ffffff; --fg:#1c1f24; --muted:#5b636e; --card:#f6f7f9;
    --border:#e3e6ea; --accent:#b45309; --accent-fg:#ffffff; --link:#9a3f00;
    --maxw:760px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171a; --fg:#e7eaee; --muted:#a2abb5; --card:#1d2126;
      --border:#2b3138; --accent:#f59e0b; --accent-fg:#14171a; --link:#fbbf24;
    }
  }
  :root[data-theme="light"]{
    --bg:#ffffff; --fg:#1c1f24; --muted:#5b636e; --card:#f6f7f9;
    --border:#e3e6ea; --accent:#b45309; --accent-fg:#ffffff; --link:#9a3f00;
  }
  :root[data-theme="dark"]{
    --bg:#14171a; --fg:#e7eaee; --muted:#a2abb5; --card:#1d2126;
    --border:#2b3138; --accent:#f59e0b; --accent-fg:#14171a; --link:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; font-size:17px;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:24px 20px 72px}
  header.top{
    display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    justify-content:space-between; margin-bottom:8px;
  }
  .brand{display:flex; align-items:center; gap:12px; font-weight:700; font-size:1.15rem}
  .brand .logo{
    width:34px;height:34px;border-radius:9px;background:var(--accent);
    color:var(--accent-fg);display:grid;place-items:center;font-size:20px;flex:0 0 auto;
  }
  nav.langs{display:flex; gap:6px; flex-wrap:wrap}
  nav.langs button{
    font:inherit; font-size:.82rem; font-weight:600; letter-spacing:.02em;
    padding:6px 11px; border-radius:999px; cursor:pointer;
    border:1px solid var(--border); background:var(--card); color:var(--muted);
    transition:all .15s ease;
  }
  nav.langs button:hover{color:var(--fg)}
  nav.langs button[aria-pressed="true"]{
    background:var(--accent); color:var(--accent-fg); border-color:var(--accent);
  }
  h1{font-size:1.7rem; line-height:1.25; margin:.4em 0 .1em}
  .meta{color:var(--muted); font-size:.9rem; margin-bottom:22px}
  h2{font-size:1.18rem; margin:1.9em 0 .5em; padding-top:.2em}
  h2 .num{color:var(--accent); font-variant-numeric:tabular-nums; margin-right:.4em}
  p{margin:.55em 0}
  ul{margin:.5em 0 .8em; padding-left:1.25em}
  li{margin:.3em 0}
  a{color:var(--link)}
  strong{font-weight:650}
  .callout{
    background:var(--card); border:1px solid var(--border); border-left:4px solid var(--accent);
    border-radius:10px; padding:14px 16px; margin:16px 0;
  }
  .callout p{margin:.3em 0}
  .contact{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:16px 18px; margin:14px 0;
  }
  .contact .row{display:flex; gap:8px; margin:.25em 0; flex-wrap:wrap}
  .contact .k{color:var(--muted); min-width:150px; font-size:.9rem}
  footer.foot{
    margin-top:40px; padding-top:18px; border-top:1px solid var(--border);
    color:var(--muted); font-size:.85rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo">&#128679;</span> Apri Cancello</div>
    <nav class="langs" aria-label="Language">
      <button type="button" data-lang="it" aria-pressed="true">Italiano</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </nav>
  </header>

  <main id="content"><!-- generato dallo script --></main>

  <footer class="foot" id="foot"></footer>
</div>

<script>

  en: {
    docTitle: "Privacy Policy and usage notes",

      "This page explains how the <strong>Apri Cancello</strong> application (\"the App\") handles the data you enter, and which usage notes apply. " +

    s1:

      "The App contains no analytics or tracking services, no advertising, and no third-party SDKs that send data over the network.",

var LABELS = {
  it:{company:"Titolare",address:"Indirizzo",vat:"Identificativo fiscale",email:"Email",web:"Sito web"},
  en:{company:"Controller",address:"Address",vat:"Tax ID",email:"Email",web:"Website"}
};

function esc(s){return String(s).replace(/[<>&]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}

function render(lang){
  var t = T[lang], lb = LABELS[lang];
  var secs = [
    ["1", t.s1t, t.s1],
    ["2", t.s2t, t.s2 + '<div class="callout"><p>'+t.s2callout+'</p></div>'],
    ["3", t.s3t, '<p>'+t.s3+'</p><p>'+t.s3b+'</p>'],
    ["4", t.s4t, t.s4],
    ["5", t.s5t, t.s5],
    ["6", t.s6t, t.s6],
    ["7", t.s7t, t.s7],
    ["8", t.s8t, t.s8]
  ];
  var emailHtml = '<a href="mailto:'+esc(CONTROLLER.email)+'">'+esc(CONTROLLER.email)+'</a>';
  var webRow = "";
  if (CONTROLLER.web) {
    webRow = '<div class="row"><span class="k">'+lb.web+'</span><span>' +
             '<a href="'+esc(CONTROLLER.web)+'" target="_blank" rel="noopener">'+esc(CONTROLLER.web)+'</a></span></div>';
  }
  var contact =
    '<div class="contact">' +
      '<div class="row"><span class="k">'+lb.company+'</span><span>'+esc(CONTROLLER.company)+'</span></div>' +
      '<div class="row"><span class="k">'+lb.address+'</span><span>'+esc(CONTROLLER.address)+'</span></div>' +
      '<div class="row"><span class="k">'+lb.vat+'</span><span>'+esc(CONTROLLER.vat)+'</span></div>' +
      '<div class="row"><span class="k">'+lb.email+'</span><span>'+emailHtml+'</span></div>' +
      webRow +
    '</div>';

  var html = '<h1>'+esc(t.docTitle)+'</h1>' +
    '<p class="meta">'+esc(t.updated)+': '+esc(EFFECTIVE[lang])+' &nbsp;&middot;&nbsp; '+esc(t.version)+' '+esc(VERSION)+'</p>' +
    '<p>'+t.intro+'</p>';
  secs.forEach(function(s){
    html += '<h2><span class="num">'+s[0]+'.</span>'+esc(s[1])+'</h2>'+s[2];
  });
  html += '<h2><span class="num">9.</span>'+esc(t.s9t)+'</h2><p>'+t.s9+'</p>'+contact;
  html += '<h2><span class="num">10.</span>'+esc(t.s10t)+'</h2><p>'+t.s10+'</p>';

  document.getElementById('content').innerHTML = html;
  document.getElementById('foot').innerHTML = esc(t.footer);
  document.documentElement.setAttribute('lang', lang);
  document.title = 'Apri Cancello — ' + t.docTitle;
  var btns = document.querySelectorAll('nav.langs button');
  for(var i=0;i<btns.length;i++){
    btns[i].setAttribute('aria-pressed', btns[i].getAttribute('data-lang')===lang ? 'true':'false');
  }
  try{ localStorage.setItem('ac_lang', lang); }catch(e){}
}

(function init(){
  var supported = {it:1,en:1};
  var lang = null;
  try{ var saved = localStorage.getItem('ac_lang'); if(saved && supported[saved]) lang = saved; }catch(e){}
  if(!lang){
    var nav = (navigator.language || navigator.userLanguage || 'it').slice(0,2).toLowerCase();
    lang = supported[nav] ? nav : 'it';
  }
  var btns = document.querySelectorAll('nav.langs button');
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener('click', function(){ render(this.getAttribute('data-lang')); });
  }
  render(lang);
})();
</script>
</body>
</html>
